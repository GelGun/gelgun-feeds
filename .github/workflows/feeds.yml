name: Generate feeds
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "feeds.py"
      - "feeds_sk.py"
      - "run_feeds.py"
      - ".github/workflows/feeds.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate feeds
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python run_feeds.py
      - name: Check the Google feeds before publishing
        # Two lists.
        #   BAD   — model names and weapon nouns. Never acceptable anywhere. Hard fail.
        #   PARTS — firearm part/ballistics vocabulary that has no place in toy product
        #           data. Hard fail. This list exists because the first Slovak feed built
        #           its descriptions from safe.features, which names parts ("mieridlá",
        #           "zameriavač"), and Merchant Center disapproved 14 items for it while
        #           the Czech feed — whose descriptions are generated — passed.
        #   SOFT  — "zásobník" / "poistka". Bound to guľôčky these are established as
        #           acceptable and the approved Czech feed contains them, so these are
        #           reported, not failed.
        run: |
          python - <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          NS = {'g': 'http://base.google.com/ns/1.0'}
          BAD   = re.compile(r'glock|m416|hk416|ak47|akm47|p90|mp5|skd|desert|pistol|pišto|puš|pusk|zbran|zbraň|samopal|tlmič|tlumič|airsoft|joule', re.I)
          PARTS = re.compile(r'mieridl|zameriav|puškohľad|puškohled|hlaveň|hlaven|dostrel|dostřel|kaliber|kalibr|nábojnic|strelivo|střelivo|výstrel|výstřel|náboj|naboj', re.I)
          SOFT  = re.compile(r'zásobník|poistk|pojistk', re.I)

          def check(path, currency, path_prefix):
              items = ET.parse(path).getroot().findall('.//item')
              bad, soft = [], 0
              for it in items:
                  get = lambda k: ((it.find('g:' + k, NS).text if it.find('g:' + k, NS) is not None else '') or '')
                  link = get('link')
                  if '&view=safe' not in link:
                      bad.append(f'{path}: link without view=safe: {link}')
                  if path_prefix and path_prefix not in link:
                      bad.append(f'{path}: link outside {path_prefix}: {link}')
                  if not get('price').endswith(currency):
                      bad.append(f'{path}: price not in {currency}: {get("price")}')
                  for field in ('title', 'description', 'image_link'):
                      v = get(field)
                      if BAD.search(v):
                          bad.append(f'{path} {field} model/weapon term: {v[:80]}')
                      if field != 'image_link' and PARTS.search(v):
                          bad.append(f'{path} {field} firearm-part term: {v[:80]}')
                  if SOFT.search(get('title') + ' ' + get('description')):
                      soft += 1
              if len(items) < 20:
                  bad.append(f'{path}: only {len(items)} items - expected ~29')
              print(f'{path}: {len(items)} items, {soft} with soft vocabulary (zásobník/poistka)')
              return bad

          problems = []
          problems += check('docs/feeds/google.xml', 'CZK', None)
          problems += check('docs/feeds/google-sk.xml', 'EUR', '/sk-sk/')
          if problems:
              print('\n'.join(problems[:20]))
              sys.exit('REFUSING TO PUBLISH')
          print('both Google feeds OK')
          PY
      - name: Commit updated feeds
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/feeds/*.xml
          git commit -m "Auto-update feeds" || echo "no changes"
          git push
